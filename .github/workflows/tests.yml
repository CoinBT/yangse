name: Node game checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/modes.js
          node --check public/chat.js
      - name: Multiplayer rules tests
        run: npm test
